csv_path: data/ohlcv_labeled/indicators.csv

leakage_blocklist:
  - VWAP_D
  - TOS_STDEVALL_LR
  - TOS_STDEVALL_L_1
  - TOS_STDEVALL_U_1
  - TOS_STDEVALL_L_2
  - TOS_STDEVALL_U_2
  - TOS_STDEVALL_L_3
  - TOS_STDEVALL_U_3
  - DEC_1
  - LDECAY_5
  - INC_1
  - THERMO_20_2_0.5
  - THERMOma_20_2_0.5
  - THERMOl_20_2_0.5
  - THERMOs_20_2_0.5
  - PDIST

start_date: 2023-01-01
end_date: 2025-01-01

scalar: StandardScaler  # StandardScaler, RobustScaler, MinMaxScaler

labels:
  mode: vol    # "bps" | "vol" | "quantile" | "cost" | "triple"
  k_vol: 0.25         # 容忍的波動倍數  (k_vol × σ)
  vol_window: 36      # 已過去36根算


k_min: 2
k_max: 80

# ======== for y corr ========
# 計算出之best_k
best_k: 10
top_n: 5     # 每個cluster的topn



# ======== for XGBoost_SFS ========
seed: 42
task_type: "reg"

start_date: "2023-01-01"
train_window: 6
embargo_hours: 24
test_freq: "1M"

data:
  precomputed_csv_path: "data/precomputed/dataset_features_y.csv"
  time_col: "timestamp"
  label_reg_col: "y"   # ← 回歸標籤
  drop_cols: []     # 若 CSV 同時含分類標籤就排除
  blocklist: []    # 安全黑名單（依你專案）

candidates_mode: "all_columns"    # or "cluster_topk" / "list_file"
candidates_list_path: "train/feature_selection/whitelist.txt"
best_k: 4
cluster_topk: 10

prefilter:
  enable: true
  mode: "xgb"             # "corr" 或 "xgb"
  corr_method: "spearman"  # corr 模式的關聯法：pearson/spearman
  keep: 40
  rounds: 1000              # 僅 xgb 模式用
  folds: 5                 # 可保留；此範本未用到

xgb:
  require_gpu: true       # 設 true 會在無 CUDA 時直接 raise
  learning_rate: 0.08
  max_depth: 4
  min_child_weight: 2.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  reg_alpha: 0.0
  n_estimators: 1500
  early_stopping_rounds: 50
  max_bin: 256
  verbosity: 0

sfs:
  max_features: 30
  min_improve: 0.001
  patience: 5

reg:
  primary_metric: "spearman"  # pearson | spearman | direction | neg_rmse | mixed
  mixed_w:
    w_corr: 0.6
    w_dir: 0.3
    w_rmse: 0.1