# feature_select/config.yaml
paths:
  tbm_labels: "data/TBM_label/3candle/3candle_label_15min.csv"
  precomputed: "data/derived/ohlcv_fng_15m_feat.csv"

  output_folder: "feature_selection/results/rank_biserial/3candle/"  
  out_csv: "rank_biserial_40_short.csv"
  selected_feat_csv: "rank_biserial_40_short_feat.csv"
  selected_feat_cols: "rank_biserial_40_short_feat_cols.txt"

index:
  dt_col_precomputed: "datetime"   # precomputed 的時間欄
  tz_precomputed: "UTC"            # 若為 "+08:00" 就填 "Asia/Taipei"
  tz_labels: "Asia/Taipei"         # 你的 TBM 標註看起來是 +08:00
  start: "2023-01-01"                      # 例如 "2023-01-01T00:00:00Z"
  end: "2025-04-30"                        # 例如 "2024-01-01T00:00:00Z"

events:
  window_bars: 144
  reduce: "ewm_zscore"     # last|sma|ema|zscore|ewm_zscore|slope|percentile
  halflife_bars: 72
  percentile_q: 0.8
  strictly_previous: false # 若事件定義需下一根才可下單，可設 true 更保守
  max_lag: null            # 例如 "2h"；超過距離就視為 NaN

cv:
  mode: "purged_kfold" # 直接用你的 train/data/folds.py
  n_splits: 5
  embargo_hours: 36
  train_val_split: 1.0
  start_date: null     # 可留空
  end_date: null       # 可留空

filter:
  side: short    # 可選: "all" | "long" | "short"

scoring:
  do_spearman: false   # 先關閉；需要簽名報酬時再開
  fdr_q: 0.10
  min_non_nan: 20     # 特徵有效樣本下限
  top_k: 40           # 額外輸出前 K 名（依 rrb_mean 排序）

columns:
  # 明確排除不該參與的欄位（label/價量/時間/重複 open,high...）
  exclude_prefix: []  # 若要先專注低頻特徵，可先排除 minute 展開欄
  exclude_exact:
    - datetime
    - timestamp
