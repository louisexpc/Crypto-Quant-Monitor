# === Input ===
input:
  csv_path: "feature_selection/results/rank_biserial/long_108_v2/rank_biserial_120_feat.csv"
  index_col: "datetime"      # 可為 "timestamp" 或 None（若整檔全是數值欄）
  start: 2023-01-03                # 例如 "2023-01-01T00:00:00Z"
  end: 2025-04-30                  # 例如 "2024-01-01T00:00:00Z"
  drop_na: false              # 是否丟掉含 NaN 的列
  exclude_cols:              # 不參與分群的欄（時間戳、標籤等）
    - datetime
    - timestamp
    - open
    - high
    - low
    - close
    - volume

# === Correlation & Distance ===
corr:
  method: "spearman"          # pearson | spearman
  clip_r: true               # 以 [-1, 1] 限制相關係數
distance:
  kind: "mantegna"           # "mantegna" 使用 d = sqrt(2*(1-r))
  # 可加上: "one_minus_abs" 選項若你想用 1 - |r|

# === Clustering ===
cluster:
  linkage: "average"         # average|complete（Ward 不適用預算好的距離）
  n_clusters: 60             # 固定分 K 群；若用 distance 門檻，改用 max_d
  max_d: null                # 例如 1.2；與 n_clusters 擇一使用
  representative: "medoid"   # medoid | max_degree（兩種代表挑選策略）

# === Reports / Output ===
report:
  make_dendrogram: true
  make_heatmap: true
  make_repr_corr_heatmap: true
  compute_silhouette: true   # 用 precomputed 距離
  compute_dbindex: false     # DB 需原始向量；可略或用 MDS 投影再近似
output:
  dir: "feature_selection/results/hierarchical_corr"
  prefix: "rb120_hcorr_60"
  save_corr_csv: true
  save_dist_csv: true
  random_state: 42
