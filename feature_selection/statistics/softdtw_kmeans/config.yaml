# === Input ===
input:
  csv_path: "data/precomputed/btcusdt_15m_features_VBT_z_norm.csv"
  index_col: "datetime"
  start: null                  # 例如 "2023-01-01T00:00:00Z"
  end: null                    # 例如 "2024-01-01T00:00:00Z"
  drop_na: true
  include_patterns: []          # 可選：僅保留符合萬用字元的欄位
  include_cols: []              # 可選：指定完整欄名白名單
  max_features: 512             # 限制特徵數避免 Soft-DTW 爆記憶體；null=不限制
  sample_strategy: "random"     # head|tail|random，當特徵超過 max_features 時的抽樣策略
  sample_random_state: 42       # random 策略下的亂數種子
  exclude_cols:
    - datetime
    - timestamp
    - open
    - high
    - low
    - close
    - volume

# === Preprocess ===
preprocess:
  zscore_each_series: false      # 若原始資料未標準化，可改為 true
  max_time_steps: 4096           # 限制時間軸長度；null=不壓縮
  time_sampling: "uniform"       # uniform|stride|head|tail

# === Soft-DTW KMeans ===
kmeans:
  n_clusters: 60
  n_init: 2
  max_iter: 50
  max_iter_barycenter: 20
  random_state: 42
  metric_params:
    gamma: 0.01                  # soft-DTW gamma（越小越近似 DTW）
  n_jobs: null                   # 可設 CPU 核數；null=預設

# === Reports / Output ===
report:
  plot_cluster_sizes: true
  plot_centroids: true
  max_centroids_to_plot: 12      # 避免視覺過載
  compute_silhouette: true
  pairwise_max_samples: 600      # 超過此特徵數就略過 pairwise 量測（避免爆記憶體）

output:
  dir: "feature_selection/results/softdtw_kmeans"
  prefix: "softdtw_k60"
  save_distance_csv: false       # 若要觀察 pairwise soft-DTW 距離可改 true
