# ./docker-compose.yml
version: '3.8'

services:
  crypto-monitor:
    build: .
    container_name: crypto_quant_monitor
    restart: always
    volumes:
      # 將日誌掛載到主機，方便查看和管理
      - ./logs:/usr/src/app/logs
    env_file:
      # 從 .env 文件加載環境變數
      - .env
    # 確保容器內網路可以訪問外部 API
    network_mode: "host"