# ./app/config.yaml
# --- 新增 exchange 區塊 ---
exchange:
  id: 'mexc'           # 交易所 ID，從 binance 改為 mexc
  default_type: 'swap' # 市場類型，'spot' (現貨) 或 'swap' (永續合約)

# System settings
schedule:
  # Run checks every 1 minute to see if a new candle has closed on any timeframe
  job_interval_minutes: 1
  cron_second: 5 # 使用 cron 在每分鐘的第 5 秒執行

# Trading pairs and timeframes to monitor
# Available timeframes: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M
monitoring:
  - symbol: "BTC/USDT:USDT"
    timeframes: ["1h", "4h"]
  - symbol: "ETH/USDT:USDT"
    timeframes: ["1h", "4h"]
  - symbol: "SOL/USDT:USDT"
    timeframes: ["1h", "4h"]
  - symbol: "XRP/USDT:USDT"
    timeframes: ["1h", "4h"]

# Analysis parameters based on timeframe
analysis_params:
  "15m":
    klines_to_fetch: 48
  "30m":
    klines_to_fetch: 48
  "1h":
    klines_to_fetch: 36
  "4h":
    klines_to_fetch: 24
  # Default fallback
  "default":
    klines_to_fetch: 50

# MongoDB Configuration
database:
  db_name: "CryptoQuantMonitor"
  collections:
    signals: "trade_signals"
    logs: "system_logs"

# AI Model settings
model:
  path: "app/models/default_model.pt" # Default model path
  # Specific models per pair/timeframe can be added here
  # "BTC/USDT_1h": "app/models/btc_usdt_1h_model.pt"