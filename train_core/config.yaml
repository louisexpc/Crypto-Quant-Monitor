# =========================
# 基本實驗設定
# =========================
seed: 42
device: cuda
project_name: BTC_XGB_ohlcv
also_XGB: true
# =========================
# 訓練設定
# =========================
train:
  lr: [1.0e-5, 1.0e-3]
  weight_decay: [1.0e-6, 1.0e-2]
  batch_size: 4096
  epochs: 200
  grad_clip: [0.0, 1.5]
  early_stopping_patience: 20
  threshold: null            # ← 只在分類時用，回歸可忽略
  amp: true
  warmup_epochs: 5
  use_focal: false           # ← 回歸無效，分類才會用到
  use_temperature: false     # ← 回歸無效，分類才會用到
  # label_smoothing: 0.05    # ← 只在分類(CE)時有用，回歸忽略

loss:
  name: emamse_pearson       # "emamse_pearson" | "mse" | "huber"
  alpha: 0.5
  beta: 0.5
  ema_decay: 0.9
  huber_delta: 1.0
  pearson_eps: 1e-8


# =========================
# 把回歸輸出轉成訊號/分類時用
# =========================
regression_to_class:
  enabled: true
  true_threshold: 0.0        # y_true 二值化門檻（>0 視為 1）
  pred_strategy: opt_fbeta   # "zero" | "opt_fbeta"
  fbeta: 0.5
  grid_points: 101



# =========================
# Optuna 搜尋
# =========================
objective:
  primary_metric: mixed   # [mixed / pearson / threshold_macro_f05 / macro_f1 / acc / val_loss]
  direction: minimize     # [minimize / maximize]
  enable_prune: true

task:
  type: regression        # [classification / regression]

search:
  n_trials: 1
  timeout: 2    # 小時
  sampler: tpe
  pruner: median
  pruner_warmup_folds: 10
  epoch_pruning: false
  seed: 42

# =========================
# 數據與切分（← 改用「原始 OHLCV」檔案路徑）
# =========================
data:
  path: data/ohlcv_2024/mexc_swap_BTC-USDT-USDT_1h.csv   #「原始 OHLCV」CSV/Parquet（含 datetime/timestamp + OHLCV）
  index_col: timestamp          # timestamp 或 datetime，對齊 Indicators
  freq: "1H"                    # 供缺口提醒（不會自動補齊）
  columns:
    time: ["datetime", "timestamp"]
    ohlcv: ["open","high","low","close","volume"]

# Cross-Validation
cv:
  type: Rolling                 # [OddEven, Anchored, Rolling]
  start_date: "2024-01-01"
  end_date:   "2025-08-01"
  train_val_split: 0.8  # train/val
  test_freq: M
  embargo_hours: [24, 48]
  min_train_days: 30
  train_months: [1, 3, 5, 7, 9]

# =========================
# 模型（回歸時請輸出1維）
# =========================
# model:
#   name: "TemporalTransformer"
#   d_model: [64, 128, 256, 512]
#   n_heads: [2, 4, 8]
#   n_layers: [2, 3, 4]
#   n_layers: 3
#   mlp_ratio: [2.0, 6.0]
#   mlp_ratio: 2.3
#   dropout: [0.0, 0.2]
#   attn_dropout: [0.0, 0.05]
#   pooling: attn
#   use_causal: true
#   num_classes: 1             # ★ 回歸=1，分類再改成2
#   # class_names: ["down", "up"]  # ★ 回歸不需要

# model:
#   name: LSTM_SE
#   hidden_size: [64, 128, 192, 256]
#   n_layers: [1, 3]
#   dropout: [0.0, 0.3]
#   bidirectional: [false]
#   num_classes: 1
#   input_norm: layernorm_last
#   class_names: ["down", "up"]

model:
  name: xgboost
  n_estimators: 2000     # 上限
  es_step: 25           # 每次增加的樹數
  es_patience: 2        # 連續幾個 step 沒進步就停
  es_min_delta: 0.0     # 最小改善幅度（RMSE 要小於 best_rmse - delta 才算進步）
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.6
  colsample_bytree: 0.6
  reg_alpha: 0.0
  reg_lambda: 1.0
  min_child_weight: 20
  tree_method: hist      
  early_stopping_rounds: 100
  n_jobs: -1


# =========================
# 標籤與序列
# =========================
label:
  horizon: 1
  ret_kind: logret             # 或 simple（runtime 產生 0/1 標籤）
  cls_threshold: 0.0

sequence:
  seq_len: 36
  step: 1
  scaler: StandardScaler
  shift_features_by: 0         # ★ 重要：Indicators 已經對所有特徵 shift(1) 防洩漏

# =========================
# Runtime 特徵（由 Indicators 動態計算與快取）
# =========================
features:
  cache_dir: cache_features
  plan:
    features:
      # ===== Group: ohlcv (基礎價格/成交量) =====
      - {name: OPEN,   kwargs: {}, enabled: true}
      - {name: HIGH,   kwargs: {}, enabled: true}
      - {name: LOW,    kwargs: {}, enabled: true}
      - {name: CLOSE,  kwargs: {}, enabled: true}
      - {name: VOLUME, kwargs: {}, enabled: true}

      # ===== Group: basic =====
      - {name: RSI,   kwargs: {length: 14},  enabled: false}
      - {name: RSI,   kwargs: {length: 30},  enabled: false}      
      - {name: MACD,  kwargs: {fast: 12, slow: 26, signal: 9}, enabled: false}
      - {name: MOM,   kwargs: {length: 30},  enabled: false}
      - {name: LOGRET,    kwargs: {length: 1}, enabled: false}

      # ===== Group: momentum =====
      - {name: STOCH, kwargs: {k: 30,  d: 3, smooth_k: 3}, enabled: false}
      - {name: STOCH, kwargs: {k: 200, d: 3, smooth_k: 3}, enabled: false}
      - {name: KDJ,       kwargs: {k: 9, d: 3, smooth_k: 3}, enabled: false}      
      - {name: RVI,       kwargs: {length: 14}, enabled: false}
      - {name: WILLR,     kwargs: {length: 14}, enabled: false}
      - {name: UO,        kwargs: {fast: 7, medium: 14, slow: 28}, enabled: false}

      # ===== Group: volatility =====
      - {name: DPO,       kwargs: {length: 20}, enabled: false}
      - {name: CCI,       kwargs: {length: 14, c: 0.015}, enabled: false}
      - {name: BBP,       kwargs: {length: 5, std: 2.0}, enabled: false}
      - {name: ZS,        kwargs: {length: 30}, enabled: false}
      - {name: SLOPE,     kwargs: {length: 1}, enabled: false}
      - {name: EBSW,      kwargs: {length: 40, mamode: 10}, enabled: false}

      # ===== Group: volume =====
      - {name: PVR,       kwargs: {}, enabled: false}      
      - {name: MASSI,     kwargs: {fast: 9, slow: 25}, enabled: false}
      - {name: PVO,       kwargs: {fast: 12, slow: 26, signal: 9}, enabled: false}
      - {name: TRUERANGE, kwargs: {}, enabled: false}
      - {name: AMATE_LR,  kwargs: {fast: 8, slow: 21, mamode: 2}, enabled: false}
      - {name: BOP,       kwargs: {}, enabled: false}

