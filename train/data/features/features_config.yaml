#       - { name: TEMA, kwargs: { length: 30, sign: false }, enabled: true }       # 三重 EMA；更平滑、延遲更低；sign 同上
#       - { name: MACD, kwargs: { fast: 12, slow: 26, signal: 9, sign: true }, enabled: true } # MACD 動能；sign=主線相對訊號線

#       # ===================== Group: momentum / oscillator（動能/震盪） =====================
#       - { name: RSI,   kwargs: { length: 14 }, enabled: true }                 # 相對強弱（超買超賣）
