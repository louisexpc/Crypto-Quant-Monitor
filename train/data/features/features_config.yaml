#       - { name: WILLR, kwargs: { length: 14 }, enabled: true }                 # 威廉指標（區間位置）
#       - { name: UO,    kwargs: { fast: 7, medium: 14, slow: 28 }, enabled: true } # 統一動量（多尺度結合）
