# config.yaml
# ==================================================
# A. Data | CV
# ==================================================
# 1. ---basic---
seed: 42
device: "cuda:1"
project_name: BTC_2-stream_rank_biserial_108_long_v2
also_XGB: false

# 2. ---Data---
data:
  path: feature_selection/results/rank_biserial/rank_biserial_60_feat.csv   # 15-minute aggregated features
  index_col: timestamp          # timestamp 或 datetime，對齊 Indicators
  freq: "15min"                    # 供缺口提醒（不會自動補齊）
  columns:
    time: ["datetime", "timestamp"]
    ohlcv: ["open","high","low","close","volume"]

  # 1-min的短時間序列
  micro:
    enabled: false
    path: data/precomputed/btcusdt_15m_features_VBT_1min_z_norm.csv
    window_len: 15                # 每根 15min bar 對應過去 15 個 1min    

# 3. ---Cross-Validation---
cv:                 
  start_date: "2023-01-04"
  end_date:   "2025-04-30"
  train_val_split: 0.8  # train/val

  # 有: [Rolling, Purged_kfold]

  # type: Rolling
  # test_freq: 3M
  # embargo_hours: 48
  # train_months: [2,3,4,5,6]

  type: Purged_kfold  
  n_splits: 5        # 分成幾個 Purged_kfold  
  embargo_hours: 72  # test 跟 train 的間隔
  min_train_days: 30 

# 4. ---sequence (往前看多久)---
sequence:
  seq_len: [144]  
  stride: [1]
  scaler: none  # [standard / robust / minmax / rolling / ewm / robust_rolling / none]
  stride_anchor: 0
  min_frac: 0.2
  preload_to_gpu: true  

# 5.TBM Label & sequence

label:
  ret_shift: 4  # horizon
  # reg
  ret_type: fractionally   # "logret" | "fractionally"
  fracdiff:
    d: 0.4
    thres: 1.0e-5

  # cls
  mode: event_tbm   # event_tbm | vol
  k_vol: 0.5             # 門檻 = k * sigma * sqrt(horizon)
  vol_window: 96         # 波動估計窗口

  tbm_csv_path: data/TBM_label/win_rate/BTC-USDT_1h_ewma_up8_dn8_lookback108_label.csv
  keep_sides: long       # 或 short；若 csv 可能同一 t0 有雙邊，請先選邊
  align_method: pad        # 若 15m 缺列再用 pad


post_infer:
  tbm_concat:
    enabled: true                 # 設為 true 啟用 trial 完成後的全區間推論 + 寫回 TBM CSV
    date_start: "2025-05-01"      # 推論起始
    date_end:   "2025-10-25"      # 推論結束
    output_column: "pred"          # 追加到 TBM CSV 的欄位名
    csv_path_override: null        # 若不為空，覆蓋 cfg.label.tbm_csv_path



# ==================================================
# B. taining設定
# ==================================================
# 1. basic
train:
  lr: [1e-5]
  weight_decay: [1e-5]
  batch_size: 256
  epochs: 300
  grad_clip: [0.3, 3.0]

  early_stopping_patience: 20
  warmup_epochs: 5

  amp: true
  amp_dtype: "bf16"       # "none" / "fp16" / "bf16" / "auto"

  grad_accum_steps: 1
  val_every: 1
  val_delay: 0

  # cls
  # ---- 動態門檻（預設 auto_fbeta 則掃 Fβ）----
  threshold_mode: auto_fbeta          # [auto_fbeta | fixed]
  threshold_fbeta: 0.5                # 只在 auto_fbeta 時使用
  threshold_grid_points: 201          # 門檻掃描點數（越大越細）
  threshold: null                     # fixed 模式才會用到；動態請設 null 或移除

  # 溫度校準可讓分數更穩定、門檻更可靠
  use_temperature: true

  # 建議在二分類時把最後一層 bias 以先驗初始化（已附 helper）
  init_bias_to_prior: true


  # ---- 連續懲罰（避免塌縮只判單類）----
  dist_align_weight: 0.3              # 分佈對齊 KL 懲罰權重（建議 0.1~0.5 起試）
  dist_prior: train                   # [train | uniform] 先驗分佈來源
  confidence_penalty: 0.0           # 置信度懲罰（鼓勵高熵，建議 1e-3~1e-2）

# 2. loss 設定
loss:
  reg:
    name: emamse_pearson       # "emamse_pearson" | "mse" | "huber"
    alpha: 0.3
    beta: 0.7
    ema_decay: 0.9
    huber_delta: 1.0  

  cls:
    # 1. CE
    label_smoothing: 0.0

    # 2. Focal Loss
    use_focal: true
    focal_gamma: 2    # 1~3
    focal_alpha: 0.25    # 0~1 / null
    conf_penalty: 0.0 # 0.01~0.1
    reduction: "mean" # ['mean' | 'sum' | 'none']
    normalized: true  # 只用於mean

# 3. collaplase guard
guard:
  enabled: false  
  pos_threshold: 0.5  # 先用 0.5 起手；每個 epoch 驗證後 trainer 會呼叫 guard.set_pos_threshold(...)  
  smoothing: 0.95     # EMA 平滑（越大越穩）— 少量 batch 場景建議 0.9~0.99
  warmup_steps: 9     # 若每 epoch ≈3 步，可設 3*3=9；你的情況可用 6~12 區間  
  entropy_hi: 0.60    # 僅在「高不確定」時才評估 PPR 是否異常（二分類熵上限 ~0.693）
  ppr_warn_band: [0.05, 0.60]   # 告警帶／極端帶 + 耐心值（連續 N 步越界才算）
  warn_patience: 40
  ppr_extreme_band: [0.02, 0.98]
  extreme_patience: 120  
  cooldown_steps: 12  # 觸發後的冷卻步數（避免連環觸發）；抓 1~2 個 epoch  
  cp_boost_factor: 1.25 # 自救策略：提高 CE 的信心懲罰、衰減學習率（不低於 min_lr）
  lr_decay: 0.8
  max_conf_penalty: 0.20
  min_lr: 1.0e-6  
  restore_on_trigger: true  # 觸發時回滾到當前最佳權重（你的 trainer 已實作 on_trigger）  
  verbose: false  # 關閉冗長列印（仍會在 trainer 端看到節流後的 WARN／TRIGGER）


# 4. reg to cls
regression_to_class:
  enabled: false
  method: opt_fbeta_on_pred     # 或 fixed_bps / abs_quantile_true / abs_quantile_pred / opt_fbeta_on_pred
  q_flat: 0.3                   # 中間約 40% 當 flat（1 - 2*q_flat）
  fbeta: 0.5
  grid_points: 201
  save_test_arrays: true


# ==================================================
# C. Optuna search
# ==================================================
# 1. task: [classification / regression]
task:   
  type: classification        

# 2. objective
objective:
  primary_metric: mcc     # class: [threshold_macro_f05 / macro_f1 / acc / mcc] ; regression: [mixed / pearson / val_loss]
  direction: maximize     # [minimize / maximize]
  enable_prune: true

# 3. search 次數 | 時長
search:
  n_trials: 10
  timeout: 10    # 小時
  sampler: tpe
  pruner: median
  pruner_warmup_folds: 20
  epoch_pruning: false
  seed: 42
  sqlite_timeout_sec: 120  # SQLite 鎖等待時間（秒）

# =========================
# D. Model
# =========================
model:
  name: "TwoStreamHybrid"   # TwoStreamHybrid / TemporalTransformer
  d_model: [32, 48, 72]
  n_heads: [1, 2, 4]
  n_layers: [1]
  mlp_ratio: 2.0
  dropout: [0, 0.3] 
  attn_dropout: [0.0, 0.1]
  pooling: attn     # ["cls" / "attn" / "mean"]
  use_causal: true
  num_classes: 2             # ★ 回歸=1，分類再改成2/3
  # class_names: ["down", "flat", "up"]  
  class_names: ["sl", "tp"] 

  # ==== Two-Stream 新增 ====
  minute_steps: 15              # 每根 15m bar 含 15 個 1m 切片
  minute_hidden: [32, 48, 64]
  minute_layers: 2
  minute_dropout: [0, 0.1]

