# config.yaml
# ==================================================
# A. Data | CV
# ==================================================
# 1. ---basic---
seed: 42
device: "cuda:0"
project_name: BTC_3candles_short_rb40
also_XGB: False

# 2. ---Data setting---
data:
  ohlcv_fng_path: data/derived/ohlcv_fng_15m.parquet
  feat_path: data/derived/ohlcv_fng_15m_feat_rb40_short.parquet
  freq: "15min"                # 供缺口提醒（不會自動補齊）
  time_zone: "UTC+08:00 (Asia/Taipei)"
  preload_to_gpu: true         # true: SeqDataset/EventDataset 直接建在 GPU；false: 放 CPU + pin_memory

  # 1-min的短時間序列
  micro:
    enabled: false
    path: data/trades/trades_feat/btcusdt_trades_1m_stats_230101-251231.parquet
    window_len: 15                # 每根 15min bar 對應過去 15 個 1min    

# 3. ---Cross-Validation---
cv:                 
  start_date: "2023-01-05"
  end_date:   "2025-04-30"
  train_val_split: 0.8  # train/val

  # 有: [Rolling, Purged_kfold]

  # type: Rolling
  # test_freq: 3M
  # embargo_hours: 48
  # train_months: [2,3,4,5,6]

  type: Purged_kfold  
  n_splits: 5        # 分成幾個 Purged_kfold  
  embargo_hours: 72  # test 跟 train 的間隔
  min_train_days: 30 

# 4. ---sequence (往前看多久)---
sequence:
  seq_len: 144  
  stride: 1

# 5.TBM Label & sequence
label:
  mode: event_tbm
  tbm_csv_path: data/TBM_label/3candle/3candle_label_15min.csv
  keep_sides: short
  align_method: pad        


# 6. Pred tbm event
post_infer:  
  enabled: true                 # 設為 true 啟用 trial 完成後的全區間推論 + 寫回 TBM CSV
  date_start: "2025-05-01"      # 推論起始
  date_end:   "2025-12-31"      # 推論結束



# ==================================================
# B. taining設定
# ==================================================
# 1. basic
train:
  lr: [1e-5, 1e-4]
  weight_decay: [1e-5]
  batch_size: 256
  epochs: 150
  grad_clip: [0.3]

  early_stopping_patience: 20
  warmup_epochs: 10

  # cls
  # ---- 動態門檻（預設 auto_fbeta 則掃 Fβ）----
  threshold_mode: auto_fbeta          # [auto_fbeta | fixed]
  threshold_fbeta: 0.5                # 只在 auto_fbeta 時使用
  threshold_grid_points: 201          # 門檻掃描點數（越大越細）
  threshold: null                     # fixed 模式才會用到；動態請設 null 或移除

  # 溫度校準可讓分數更穩定、門檻更可靠
  use_temperature: true

# 2. loss 設定
loss:
  reg:
    name: emamse_pearson       # "emamse_pearson" | "mse" | "huber"
    alpha: 0.3
    beta: 0.7
    ema_decay: 0.9
    huber_delta: 1.0  

  cls:
    use_class_weight: False

# 3. reg to cls
regression_to_class:
  enabled: false
  method: opt_fbeta_on_pred     # 或 fixed_bps / abs_quantile_true / abs_quantile_pred / opt_fbeta_on_pred
  q_flat: 0.3                   # 中間約 40% 當 flat（1 - 2*q_flat）
  fbeta: 0.5
  grid_points: 201
  save_test_arrays: true


# ==================================================
# C. Optuna search
# ==================================================
# 1. task: [classification / regression]
task:   
  type: classification        

# 2. objective
objective:
  primary_metric: mcc     # class: [threshold_macro_f05 / macro_f1 / acc / mcc] ; regression: [mixed / pearson / val_loss]
  direction: maximize     # [minimize / maximize]
  enable_prune: true

# 3. search 次數 | 時長
search:
  n_trials: 10
  timeout: 10    # 小時
  sampler: tpe
  pruner: median
  pruner_warmup_folds: 20
  epoch_pruning: false
  seed: 42
  sqlite_timeout_sec: 120  # SQLite 鎖等待時間（秒）

# =========================
# D. Model
# =========================
model:
  name: "TwoStreamHybrid"   # TwoStreamHybrid / TemporalTransformer
  d_model: [32, 48, 64]
  n_heads: [2]
  num_layers: [1,2]
  mlp_ratio: 2.0
  dropout: 0.05
  attn_dropout: 0.0
  pooling: attn     # ["cls" / "attn" / "mean"]
  use_causal: true
  num_classes: 3             # ★ 回歸=1，分類再改成2/3
  class_names: ["sl", "draw", "tp"]  
  # class_names: ["sl", "tp"] 

  # ==== Two-Stream 新增 ====
  minute_steps: 15              # 每根 15m bar 含 15 個 1m 切片
  minute_hidden: [8, 12, 16]
  minute_layers: 2
  minute_dropout: 0.0

