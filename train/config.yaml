# config.yaml
# =========================
# 基本實驗設定
# =========================
seed: 42
device: cuda
project_name: BTC_Two-stream_FNG_reg_fracdiff
also_XGB: true

# =========================
# 訓練設定
# =========================
train:
  lr: [1e-5, 3e-4]
  weight_decay: [1e-6, 3e-2]
  batch_size: 512
  epochs: 300
  grad_clip: [0.3, 3.0]
  early_stopping_patience: 30
  threshold: 0.0            # ← 只在分類時用，回歸可忽略
  amp: true
  warmup_epochs: 5

  use_focal: false           # ← 回歸無效，分類才會用到
  label_smoothing: 0.05    # ← 只在分類(CE)時有用，回歸忽略
  amp_dtype: "bf16"       # "none" / "fp16" / "bf16" / "auto"
  

loss:
  name: emamse_pearson       # "emamse_pearson" | "mse" | "huber"
  alpha: 0.3
  beta: 0.7
  ema_decay: 0.9
  huber_delta: 1.0
  pearson_eps: 1e-8


# =========================
# 把回歸輸出轉成訊號/分類時用
# =========================
regression_to_class:
  enabled: false
  method: opt_fbeta_on_pred     # 或 fixed_bps / abs_quantile_true / abs_quantile_pred / opt_fbeta_on_pred
  q_flat: 0.3                   # 中間約 40% 當 flat（1 - 2*q_flat）
  fbeta: 0.5
  grid_points: 201
  save_test_arrays: true


# =========================
# Optuna 搜尋
# =========================
objective:
  primary_metric: mixed   # class: [threshold_macro_f05 / macro_f1 / acc / val_loss] ; regression: [mixed / pearson ]
  direction: minimize     # [minimize / maximize]
  enable_prune: true

task:   # [classification / regression]
  type: regression        

search:
  n_trials: 1
  timeout: 6    # 小時
  sampler: tpe
  pruner: median
  pruner_warmup_folds: 20
  epoch_pruning: false
  seed: 42

  multi_gpu:
    enabled: false           # 打開就會啟兩個子程序併行；false=單進程
    gpu_ids: [0, 1]         # 5070 Ti / 4060
    sqlite_timeout_sec: 120  # SQLite 併發鎖等待時間（建議 60~300）

# =========================
# 數據與切分（← 改用「原始 OHLCV」檔案路徑）
# =========================
data:
  path: data/FNG/btcusdt_15m_with_fng_with_flat_1m.csv
  index_col: timestamp          # timestamp 或 datetime，對齊 Indicators
  freq: "15min"                    # 供缺口提醒（不會自動補齊）
  columns:
    time: ["datetime", "timestamp"]
    ohlcv: ["open","high","low","close","volume"]
  # 吃1-min的
  micro:
    enabled: true
    window_len: 15                # 每根 15min bar 對應過去 15 個 1min    

# Cross-Validation
cv:
  type: Rolling                 # [OddEven, Anchored, Rolling]
  start_date: "2024-01-01"
  end_date:   "2025-08-01"
  train_val_split: 0.8  # train/val
  test_freq: M
  embargo_hours: 24
  min_train_days: 30
  train_months: 3

sequence:
  seq_len: 144
  stride: 4 
  scaler: standard  # [standard / robust / minmax / rolling / ewm / robust_rolling / none]
  stride_anchor: 0
  min_frac: 0.85
  preload_to_gpu: true  

# =========================
# 模型（回歸時請輸出1維）
# =========================
model:
  name: "TwoStreamHybrid"   # TwoStreamHybrid / TemporalTransformer
  d_model: [64, 96, 128]
  n_heads: [2, 4, 8]
  n_layers: [2,3,4]
  mlp_ratio: 2.0
  dropout: [0.0, 0.3] 
  attn_dropout: [0.0, 0.1]
  pooling: attn     # ["cls" / "attn" / "mean"]
  use_causal: true
  num_classes: 1             # ★ 回歸=1，分類再改成3
  class_names: ["down", "flat", "up"]  
  # class_names: ["down", "up"]  

  # ==== Two-Stream 新增 ====
  minute_steps: 15              # 每根 15m bar 含 15 個 1m 切片
  minute_hidden: [32, 64, 96]
  minute_layers: [1,3]
  minute_dropout: [0.0,0.3]



# model:
#   name: xgboost
#   n_estimators: 2000     # 上限
#   es_step: 25           # 每次增加的樹數
#   es_patience: 2        # 連續幾個 step 沒進步就停
#   es_min_delta: 0.0     # 最小改善幅度（RMSE 要小於 best_rmse - delta 才算進步）
