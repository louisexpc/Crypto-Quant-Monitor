#   reg_alpha: 0.0
#   reg_lambda: 1.0
#   min_child_weight: 20
#   tree_method: hist      
#   early_stopping_rounds: 100
#   n_jobs: -1


# =========================
# 標籤與序列
# =========================
label:
  ret_shift: 4  # horizon
  # reg
  ret_type: fractionally   # "logret" | "fractionally"
  fracdiff:
    d: 0.4
    thres: 1.0e-5

  # cls
  mode: vol 
  k_vol: 0.5             # 門檻 = k * sigma * sqrt(horizon)
  vol_window: 96         # 波動估計窗口

  # mode: event_tbm
  tbm_csv_path: data/TBM_label/BTC-USDT_1h_atr_lookback36_label.csv
  keep_sides: long           # 或 short；若 csv 可能同一 t0 有雙邊，請先選邊
  align_method: exact        # 若 15m 缺列再用 pad



# # =========================
# # Runtime 特徵（由 Indicators 動態計算與快取）
# # =========================
features:
  cache_dir: cache_features
  plan:
    features:
      # ===================== Group: ohlcv（原始） =====================
      - { name: OPEN,   kwargs: {}, enabled: false }     # 開盤價（原始特徵）
      - { name: HIGH,   kwargs: {}, enabled: false }     # 最高價（原始特徵）
      - { name: LOW,    kwargs: {}, enabled: false }     # 最低價（原始特徵）
      - { name: CLOSE,  kwargs: {}, enabled: false }     # 收盤價（原始特徵）
      - { name: VOLUME, kwargs: {}, enabled: true }     # 成交量（原始特徵）

      # ===================== Group: volume（原始成交量與量能指標） =====================      
      - { name: PVO,    kwargs: { fast: 12, slow: 26, signal: 9 }, enabled: false } # 量的 MACD（量能動能）
      - { name: PVR,    kwargs: {}, enabled: false  }                                # 價量比率（price-volume ratio）
      - { name: BOP,    kwargs: {}, enabled: false  }                                # 買方/賣方力量（Body 對區間）

      # ===================== Group: trend（趨勢/均線/去趨勢） =====================
      - { name: SLOPE,     kwargs: { length: 5 }, enabled: true }              # 收盤價線性回歸斜率（近端趨勢）
      - { name: TTM_TRND,  kwargs: { length: 6 }, enabled: true }              # TTM 趨勢過濾
      - { name: DPO,       kwargs: { length: 20 }, enabled: true }             # 去趨勢震盪器（移除長期趨勢）
      - { name: AMATE_LR,  kwargs: { fast: 8, slow: 21, mamode: 2 }, enabled: false }  # AMAT 長週期線（趨勢通道）

      # —— 均線/動能（只輸出 sign：-1/0/1）——
      - { name: SMA,  kwargs: { length: 50, sign: true }, enabled: false }       # 簡單均線；sign=收盤相對 SMA 的方向
      - { name: EMA,  kwargs: { length: 21, sign: true }, enabled: false }       # 指數均線；較敏感；sign 同上
      - { name: TEMA, kwargs: { length: 30, sign: true }, enabled: false }       # 三重 EMA；更平滑、延遲更低；sign 同上
      - { name: MACD, kwargs: { fast: 12, slow: 26, signal: 9, sign: false }, enabled: false } # MACD 動能；sign=主線相對訊號線

      # ===================== Group: momentum / oscillator（動能/震盪） =====================
      - { name: RSI,   kwargs: { length: 14 }, enabled: true }                 # 相對強弱（超買超賣）
      - { name: RSI,   kwargs: { length: 30 }, enabled: true }                 # 較長期 RSI
      - { name: MOM,   kwargs: { length: 30 }, enabled: true  }                 # 價格動量
      - { name: STOCH, kwargs: { k: 30,  d: 3, smooth_k: 3 }, enabled: false }  # 隨機指標 %K/%D（短期）
      - { name: STOCH, kwargs: { k: 200, d: 3, smooth_k: 3 }, enabled: false }  # 隨機指標（更長期）
      - { name: KDJ,   kwargs: { k: 9, d: 3, smooth_k: 3 }, enabled: false }    # KDJ 的 J 線（放大動能）
      - { name: RVI,   kwargs: { length: 14 }, enabled: false }                 # 相對活力指標
      - { name: WILLR, kwargs: { length: 14 }, enabled: false }                 # 威廉指標（區間位置）
      - { name: UO,    kwargs: { fast: 7, medium: 14, slow: 28 }, enabled: false } # 統一動量（多尺度結合）
      - { name: CCI,   kwargs: { length: 14, c: 0.015 }, enabled: true }       # 商品通道（偏離均值）
      - { name: ZS,    kwargs: { length: 30 }, enabled: true }                 # 滾動 Z 分數（標準化偏離）

      # ===================== Group: volatility（波動/區間） =====================
      - { name: TRUERANGE, kwargs: {}, enabled: true  }                         # 單期真實區間（HL 與跳空）
      - { name: ATR,       kwargs: { length: 14, pct: true }, enabled: true  }   # 平均真實波動；pct=相對收盤比例
      - { name: RANGE,     kwargs: { window: 24, pct: true }, enabled: true }   # HL 區間的滾動均值；pct=相對收盤
      - { name: MASSI,     kwargs: { fast: 9, slow: 25 }, enabled: false }      # Mass Index（高低擴張）
      - { name: BBP,       kwargs: { length: 5, std: 2.0 }, enabled: true }    # 布林通道百分位位置
      - { name: EWMRET,    kwargs: { halflife: [6,12,48] }, enabled: true }     # logret 的 EWM 均值/標準差（波動/漂移）

      # ===================== Group: price_volume（價量交互） =====================
      - { name: PXVOL, kwargs: {}, enabled: true }                              # 方向強度、logret×量變、方向×量

      # ===================== Group: returns（報酬） =====================
      - { name: LOGRET, kwargs: { lags: [1,2,3,5,10], pct: true }, enabled: true } # 多期簡單報酬（%），含短中期

      # ===================== Group: time（時間週期） =====================
      - { name: TIME_CYC, kwargs: { tz: "Asia/Taipei", daily: true, weekly: true }, enabled: false } # 日內/週期 sin/cos

      # ===================== Group: funding rate（資金費率） =====================
      - { name: FOUND, kwargs: {}, enabled: false }                                 # 每 8 小時資金費率，可作為散戶情緒 proxy
      # ===================== Group: fast signal（15分鐘子訊號） =====================
      - { name: M15_DIR, kwargs: {}, enabled: false }                               # 三段 m15 漲跌 (01/12/23) → 類似細粒度動能
      - { name: M15_VOL, kwargs: {}, enabled: false }     

      # ===================== Group: Sentiment index（15分鐘子訊號） =====================
      - { name: FNG_IDX, kwargs: {}, enabled: true }    

  min_trade_feat:
    - "imbalance"
    - "buy_ratio"
    - "buy_count_ratio"
    - "price_mean"
    - "price_vwap"
    # - "price_min"
    - "price_max"
    - "trend_slope"