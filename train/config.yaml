# config.yaml
# ==================================================
# A. Data | CV
# ==================================================
# 1. ---basic---
seed: 42
device: cuda
project_name: BTC_ewma_up3_dn3_lookback108_long

also_XGB: true

# 2. ---Data---
data:
  path: data/precomputed/btcusdt_15m_features.parquet  # precomputed feat data: include flat 1-min and FNG
  index_col: timestamp          # timestamp 或 datetime，對齊 Indicators
  freq: "15min"                    # 供缺口提醒（不會自動補齊）
  columns:
    time: ["datetime", "timestamp"]
    ohlcv: ["open","high","low","close","volume"]
  # 吃1-min的
  micro:
    enabled: false
    window_len: 15                # 每根 15min bar 對應過去 15 個 1min    

# 3. ---Cross-Validation---
cv:                 
  start_date: "2023-01-01"
  end_date:   "2025-04-30"
  train_val_split: 0.8  # train/val

  # [Rolling, Purged_kfold]

  # type: Rolling
  # test_freq: 3M
  # embargo_hours: 48
  # train_months: [2,3,4,5,6]

  type: Purged_kfold  
  n_splits: 5
  embargo_hours: 72
  min_train_days: 30

# 4. ---sequence (往前看多久)---
sequence:
  seq_len: [36, 72, 144, 288, 432]  # , 216, 288
  stride: [1, 2, 4, 12, 24]
  scaler: standard  # [standard / robust / minmax / rolling / ewm / robust_rolling / none]
  stride_anchor: 0
  min_frac: 0.2
  preload_to_gpu: true  


# ==================================================
# B. taining設定
# ==================================================
# 1. basic
train:
  lr: [1e-5, 3e-4]
  weight_decay: [1e-6, 3e-4]
  batch_size: 256
  epochs: 300
  grad_clip: [0.3, 3.0]

  early_stopping_patience: 20
  warmup_epochs: 5

  amp: true
  amp_dtype: "bf16"       # "none" / "fp16" / "bf16" / "auto"

  grad_accum_steps: 1
  val_every: 5
  val_delay: 0

  # cls
  # ---- 動態門檻（預設 auto_auc=Youden J；改成 auto_fbeta 則掃 Fβ）----
  threshold_mode: auto_fbeta          # [auto_auc | auto_fbeta | fixed]
  threshold_fbeta: 0.5                # 只在 auto_fbeta 時使用
  threshold_grid_points: 201          # 門檻掃描點數（越大越細）
  threshold: null                     # fixed 模式才會用到；動態請設 null 或移除

  # 溫度校準可讓分數更穩定、門檻更可靠
  use_temperature: true

  # 建議在二分類時把最後一層 bias 以先驗初始化（已附 helper）
  init_bias_to_prior: true


  # ---- 連續懲罰（避免塌縮只判單類）----
  dist_align_weight: 0.3              # 分佈對齊 KL 懲罰權重（建議 0.1~0.5 起試）
  dist_prior: train                   # [train | uniform] 先驗分佈來源
  confidence_penalty: 0.0           # 置信度懲罰（鼓勵高熵，建議 1e-3~1e-2）

# 2. loss 設定
loss:
  reg:
    name: emamse_pearson       # "emamse_pearson" | "mse" | "huber"
    alpha: 0.3
    beta: 0.7
    ema_decay: 0.9
    huber_delta: 1.0  

  cls:
    # 1. CE
    label_smoothing: 0.0

    # 2. Focal Loss
    use_focal: true
    focal_gamma: 2    # 1~3
    focal_alpha: 0.25    # 0~1 / null
    conf_penalty: 0.0 # 0.01~0.1
    reduction: "mean" # ['mean' | 'sum' | 'none']
    normalized: true  # 只用於mean

# 3. collaplase guard
# guard:
#   enabled: true
#   pos_threshold: 0.5         # 若 threshold_mode=fixed 可省略，會自動讀 train.threshold
#   ppr_warn_band: [0.55, 0.90]
#   warn_patience: 60
#   ppr_extreme_band: [0.02, 0.98]
#   extreme_patience: 100
#   cp_boost_factor: 1.0
#   lr_decay: 0.8
#   max_conf_penalty: 0.02
#   smoothing: 0.2             # EMA 平滑（0 表示不用）
#   restore_on_trigger: true   # 觸發時回滾最佳權重

guard:
  enabled: true  
  pos_threshold: 0.5  # 先用 0.5 起手；每個 epoch 驗證後 trainer 會呼叫 guard.set_pos_threshold(...)  
  smoothing: 0.95     # EMA 平滑（越大越穩）— 少量 batch 場景建議 0.9~0.99
  warmup_steps: 9     # 若每 epoch ≈3 步，可設 3*3=9；你的情況可用 6~12 區間  
  entropy_hi: 0.60    # 僅在「高不確定」時才評估 PPR 是否異常（二分類熵上限 ~0.693）
  ppr_warn_band: [0.05, 0.60]   # 告警帶／極端帶 + 耐心值（連續 N 步越界才算）
  warn_patience: 40
  ppr_extreme_band: [0.02, 0.98]
  extreme_patience: 120  
  cooldown_steps: 12  # 觸發後的冷卻步數（避免連環觸發）；抓 1~2 個 epoch  
  cp_boost_factor: 1.25 # 自救策略：提高 CE 的信心懲罰、衰減學習率（不低於 min_lr）
  lr_decay: 0.8
  max_conf_penalty: 0.20
  min_lr: 1.0e-6  
  restore_on_trigger: true  # 觸發時回滾到當前最佳權重（你的 trainer 已實作 on_trigger）  
  verbose: false  # 關閉冗長列印（仍會在 trainer 端看到節流後的 WARN／TRIGGER）


# 4. reg to cls
regression_to_class:
  enabled: false
  method: opt_fbeta_on_pred     # 或 fixed_bps / abs_quantile_true / abs_quantile_pred / opt_fbeta_on_pred
  q_flat: 0.3                   # 中間約 40% 當 flat（1 - 2*q_flat）
  fbeta: 0.5
  grid_points: 201
  save_test_arrays: true


# ==================================================
# C. Optuna search
# ==================================================
# 1. task: [classification / regression]
task:   
  type: classification        

# 2. objective
objective:
  primary_metric: mcc     # class: [threshold_macro_f05 / macro_f1 / acc / mcc] ; regression: [mixed / pearson / val_loss]
  direction: maximize     # [minimize / maximize]
  enable_prune: true

# 3. search 次數 | 時長 | multi_gpu
search:
  n_trials: 50
  timeout: 10    # 小時
  sampler: tpe
  pruner: median
  pruner_warmup_folds: 20
  epoch_pruning: false
  seed: 42

  multi_gpu:
    enabled: false           # 打開就會啟兩個子程序併行；false=單進程
    gpu_ids: [0, 1]         # 5070 Ti / 4060
    sqlite_timeout_sec: 120  # SQLite 併發鎖等待時間（建議 60~300）

# =========================
# D. Model
# =========================
model:
  name: "TwoStreamHybrid"   # TwoStreamHybrid / TemporalTransformer
  d_model: [64, 80, 96]
  n_heads: [2, 4]
  n_layers: [1, 2, 3]
  mlp_ratio: 2.0
  dropout: [0.1, 0.25] 
  attn_dropout: [0.0, 0.1]
  pooling: attn     # ["cls" / "attn" / "mean"]
  use_causal: true
  num_classes: 2             # ★ 回歸=1，分類再改成2/3
  # class_names: ["down", "flat", "up"]  
  class_names: ["sl", "tp"] 

  # ==== Two-Stream 新增 ====
  minute_steps: 15              # 每根 15m bar 含 15 個 1m 切片
  minute_hidden: [32, 64]
  minute_layers: 2
  minute_dropout: [0.0, 0.1]

# =========================
# E. Label & sequence
# =========================
label:
  ret_shift: 4  # horizon
  # reg
  ret_type: fractionally   # "logret" | "fractionally"
  fracdiff:
    d: 0.4
    thres: 1.0e-5

  # cls
  mode: event_tbm   # event_tbm | vol
  k_vol: 0.5             # 門檻 = k * sigma * sqrt(horizon)
  vol_window: 96         # 波動估計窗口

  tbm_csv_path: data/TBM_label/BTC-USDT_1h_atr_up4_dn2.5_lookback108_label.csv
  keep_sides: long       # 或 short；若 csv 可能同一 t0 有雙邊，請先選邊
  align_method: pad        # 若 15m 缺列再用 pad


post_infer:
  tbm_concat:
    enabled: true                 # 設為 true 啟用 trial 完成後的全區間推論 + 寫回 TBM CSV
    date_start: "2023-01-01"      # 推論起始
    date_end:   "2025-08-22"      # 推論結束
    output_column: "pred"          # 追加到 TBM CSV 的欄位名
    csv_path_override: null        # 若不為空，覆蓋 cfg.label.tbm_csv_path


# =========================
# F. Selected Features
# =========================
features:
  plan:
    features:
      # ===================== Group: ohlcv（原始） =====================
      - { name: OPEN,   kwargs: {}, enabled: false }     # 開盤價（原始特徵）
      - { name: HIGH,   kwargs: {}, enabled: false }     # 最高價（原始特徵）
      - { name: LOW,    kwargs: {}, enabled: false }     # 最低價（原始特徵）
      - { name: CLOSE,  kwargs: {}, enabled: false }     # 收盤價（原始特徵）
      - { name: VOLUME, kwargs: {}, enabled: true }     # 成交量（原始特徵）

      # ===================== Group: volume（原始成交量與量能指標） =====================      
      - { name: PVO,    kwargs: { fast: 12, slow: 26, signal: 9 }, enabled: false } # 量的 MACD（量能動能）
      - { name: PVR,    kwargs: {}, enabled: false  }                                # 價量比率（price-volume ratio）
      - { name: BOP,    kwargs: {}, enabled: false  }                                # 買方/賣方力量（Body 對區間）

      # ===================== Group: trend（趨勢/均線/去趨勢） =====================
      - { name: SLOPE,     kwargs: { length: 5 }, enabled: true }              # 收盤價線性回歸斜率（近端趨勢）
      - { name: TTM_TRND,  kwargs: { length: 6 }, enabled: true }              # TTM 趨勢過濾
      - { name: DPO,       kwargs: { length: 20 }, enabled: true }             # 去趨勢震盪器（移除長期趨勢）
      - { name: AMATE_LR,  kwargs: { fast: 8, slow: 21, mamode: 2 }, enabled: false }  # AMAT 長週期線（趨勢通道）

      # —— 均線/動能（只輸出 sign：-1/0/1）——
      - { name: SMA,  kwargs: { length: 50, sign: true }, enabled: false }       # 簡單均線；sign=收盤相對 SMA 的方向
      - { name: EMA,  kwargs: { length: 21, sign: true }, enabled: false }       # 指數均線；較敏感；sign 同上
      - { name: TEMA, kwargs: { length: 30, sign: true }, enabled: false }       # 三重 EMA；更平滑、延遲更低；sign 同上
      - { name: MACD, kwargs: { fast: 12, slow: 26, signal: 9, sign: false }, enabled: false } # MACD 動能；sign=主線相對訊號線

      # ===================== Group: momentum / oscillator（動能/震盪） =====================
      - { name: RSI,   kwargs: { length: 14 }, enabled: true }                 # 相對強弱（超買超賣）
      - { name: RSI,   kwargs: { length: 30 }, enabled: true }                 # 較長期 RSI
      - { name: MOM,   kwargs: { length: 30 }, enabled: true  }                 # 價格動量
      - { name: STOCH, kwargs: { k: 30,  d: 3, smooth_k: 3 }, enabled: false }  # 隨機指標 %K/%D（短期）
      - { name: STOCH, kwargs: { k: 200, d: 3, smooth_k: 3 }, enabled: false }  # 隨機指標（更長期）
      - { name: KDJ,   kwargs: { k: 9, d: 3, smooth_k: 3 }, enabled: false }    # KDJ 的 J 線（放大動能）
      - { name: RVI,   kwargs: { length: 14 }, enabled: false }                 # 相對活力指標
      - { name: WILLR, kwargs: { length: 14 }, enabled: false }                 # 威廉指標（區間位置）
      - { name: UO,    kwargs: { fast: 7, medium: 14, slow: 28 }, enabled: false } # 統一動量（多尺度結合）
      - { name: CCI,   kwargs: { length: 14, c: 0.015 }, enabled: true }       # 商品通道（偏離均值）
      - { name: ZS,    kwargs: { length: 30 }, enabled: true }                 # 滾動 Z 分數（標準化偏離）

      # ===================== Group: volatility（波動/區間） =====================
      - { name: TRUERANGE, kwargs: {}, enabled: true  }                         # 單期真實區間（HL 與跳空）
      - { name: ATR,       kwargs: { length: 14, pct: true }, enabled: true  }   # 平均真實波動；pct=相對收盤比例
      - { name: RANGE,     kwargs: { window: 24, pct: true }, enabled: true }   # HL 區間的滾動均值；pct=相對收盤
      - { name: MASSI,     kwargs: { fast: 9, slow: 25 }, enabled: false }      # Mass Index（高低擴張）
      - { name: BBP,       kwargs: { length: 5, std: 2.0 }, enabled: true }    # 布林通道百分位位置
      - { name: EWMRET,    kwargs: { halflife: [6,12,48] }, enabled: true }     # logret 的 EWM 均值/標準差（波動/漂移）

      # ===================== Group: price_volume（價量交互） =====================
      - { name: PXVOL, kwargs: {}, enabled: true }                              # 方向強度、logret×量變、方向×量

      # ===================== Group: returns（報酬） =====================
      - { name: LOGRET, kwargs: { lags: [1,2,3,5,10], pct: true }, enabled: true } # 多期簡單報酬（%），含短中期

      # ===================== Group: time（時間週期） =====================
      - { name: TIME_CYC, kwargs: { tz: "Asia/Taipei", daily: true, weekly: true }, enabled: false } # 日內/週期 sin/cos

      # ===================== Group: funding rate（資金費率） =====================
      - { name: FOUND, kwargs: {}, enabled: false }                                 # 每 8 小時資金費率，可作為散戶情緒 proxy
      # ===================== Group: fast signal（15分鐘子訊號） =====================
      - { name: M15_DIR, kwargs: {}, enabled: false }                               # 三段 m15 漲跌 (01/12/23) → 類似細粒度動能
      - { name: M15_VOL, kwargs: {}, enabled: false }     

      # ===================== Group: Sentiment index（15分鐘子訊號） =====================
      - { name: FNG_IDX, kwargs: {}, enabled: true }    

  min_trade_feat:
    - "imbalance"
    - "buy_ratio"
    - "buy_count_ratio"
    - "price_mean"
    - "price_vwap"
    - "price_max"
    - "trend_slope"
