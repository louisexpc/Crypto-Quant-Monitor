[project]
name = "crypto-quant-monitor"        # 套件名稱（隨你，但別跟 PyPI 熱門包撞名）
version = "0.0.1"
description = "Quant training pipeline with ADML CV and TBM event labeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []                    # 如需自動安裝依賴可填，但你已有 train_requirements.txt

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["train*", "feature_selection*"]                 # 只封裝 train/ 這棵樹（你也可擴到其它子包）
