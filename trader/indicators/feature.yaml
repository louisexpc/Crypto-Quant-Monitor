time:
  columns: ["datetime", "timestamp"]   # 從這些欄位擇一作為時間索引；若皆缺，需已有 DatetimeIndex
  freq: "15m"                        # 等距檢查用；不自動補齊

ohlcv_required: ["open", "high", "low", "close", "volume", "fng"]

#交易聚合
trades:
  enabled: False
  window_len: 15                       # 每根 15m bar 參考過去 15 根 1m 視窗（t-1 以前）

feat_plan:
  long_feat_path: "./indicators/config/long_config.yaml"
  short_feat_path: "./indicators/config/short_config.yaml"

manifest_path: "/indicators/config/manifest.json"   # optional: training manifest for reference

# 長/短單白名單（若空則計算全部啟用特徵）
selected_feat_path:
  long: "./indicators/config/rank_biserial_120_feats_long.txt"
  short: "./indicators/config/rank_biserial_120_feats_short.txt"

feat_normalization:
  enabled: True                       # 若要 rolling z-score，改為 true
  rolling_window: 144                  # 滑動窗口長度（僅在 enabled 時使用）
  skip_cols: ["open", "high", "low", "close", "volume", "fng"]

nan_policy: "linear_interp"                    # raise | drop | linear_interp
