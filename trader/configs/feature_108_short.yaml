features:
  plan:
    # === 時間週期：對應 DOW_SIN ===
    - name: TIME_CYC
      enabled: true
      kwargs:
        tz: "Asia/Taipei"
        daily: false          # 只要週期，不要日內
        weekly: true          # 會產生 DOW_SIN, DOW_COS

    # === FNG：包含 sent_fng_diff1 ===
    - name: FNG_IDX
      enabled: true
      kwargs: {}

    # === ATR / ATRP：ATR_14, ATRP_14, ATR_28, ATRP_28 ===
    - name: ATR
      enabled: true
      kwargs:
        length: 14
        pct: true

    - name: ATR
      enabled: true
      kwargs:
        length: 28
        pct: true

    # === RANGE：RANGE_16, RANGE_32 ===
    - name: RANGE
      enabled: true
      kwargs:
        window: 16
        pct: true

    - name: RANGE
      enabled: true
      kwargs:
        window: 32
        pct: true

    # === LOGRET：LOGRET_1, LOGRET_16 ===
    - name: LOGRET
      enabled: true
      kwargs:
        lags: [1, 16]
        pct: false

    # === RSI：RSI_14, RSI_28 ===
    - name: RSI
      enabled: true
      kwargs:
        length: 14

    - name: RSI
      enabled: true
      kwargs:
        length: 28

    # === KDJ J 線：J_9_3 / kdj__j__0 ===
    - name: KDJ
      enabled: true
      kwargs:
        k: 9
        d: 3
        smooth_k: 3

    # === AMAT 長期趨勢：AMATe_LR_8_21_2 / amat__amate_lr__close ===
    - name: AMATE_LR
      enabled: true
      kwargs:
        fast: 8
        slow: 21
        mamode: "ema"

    # === PVO（custom builder）：PVO_4_12_6, PVO_12_26_9 ===
    - name: PVO
      enabled: true
      kwargs:
        fast: 4
        slow: 12
        signal: 6

    - name: PVO
      enabled: true
      kwargs:
        fast: 12
        slow: 26
        signal: 9

    # === PVR（Price Volume Ratio / Rank）：PVR ===
    - name: PVR
      enabled: true
      kwargs: {}

    # === PXV_LR_VCHG：build_PXVOL ===
    - name: PXVOL
      enabled: true
      kwargs: {}

    # === EWMRET：EWM_S_4, EWM_S_12, EWM_S_48, EWM_M_12, EWM_M_48 ===
    - name: EWMRET
      enabled: true
      kwargs:
        halflife: [4, 12, 48]

    # === ZS：ZS_[8, 32, 96] ===
    - name: ZS
      enabled: true
      kwargs:
        length: 8

    - name: ZS
      enabled: true
      kwargs:
        length: 32

    - name: ZS
      enabled: true
      kwargs:
        length: 96

    # === SLOPE：SLOPE_[4, 8, 16] ===
    - name: SLOPE
      enabled: true
      kwargs:
        length: 4

    - name: SLOPE
      enabled: true
      kwargs:
        length: 8

    - name: SLOPE
      enabled: true
      kwargs:
        length: 16

    # === MOM：MOM_[4, 8, 16] ===
    - name: MOM
      enabled: true
      kwargs:
        length: 4
    - name: MOM
      enabled: true
      kwargs:
        length: 8
    - name: MOM
      enabled: true
      kwargs:
        length: 16

    # === 透過 VBT 跑 pandas_ta 指標 ===
    - VBT:
        enabled: true
        kwargs:
          lib: pandas_ta
          all: false
          # 排除輸出巨大或多輸入難匹配的族群，避免記憶體爆炸
          exclude: ["*matrix*", "*ichimoku*", "*kama*", "*wave*", "*aroon*", "*psar*", "*vwap*"]
          items:
            # 1) er__er__close
            - fn: "er"
              inputs: "close"
              grid:
                length: 10
                drift: 1

            # 2) thermo__thermos__0
            - fn: "thermo"
              inputs: ["high", "low", "close"]
              grid:
                length: 20
                long: 2
                short: 0.5
                mamode: "ema"

            # 3) squeeze_pro__sqzpro_off__0 / squeeze_pro__sqzpro_on_narrow__0
            - fn: "squeeze_pro"
              inputs: ["high", "low", "close"]
              grid:
                bb_length: 20
                bb_std: 2.0
                kc_length: 20
                kc_scalar_wide: 2.0
                kc_scalar_normal: 1.5
                kc_scalar_narrow: 1.0
                mom_length: 12
                mom_smooth: 6
                mamode: "sma"

            # 4) pvo__pvoh__volume / pvo__pvo__volume （pandas_ta.pvo）
            - fn: "pvo"
              inputs: "volume"
              grid:
                fast: 12
                slow: 26
                signal: 9
                scalar: 100

            # 5) stoch__stochh__0
            - fn: "stoch"
              inputs: ["high", "low", "close"]
              grid:
                k: 14
                d: 3
                smooth_k: 3
                mamode: "sma"

            # 6) tos_stdevall__tos_stdevall_lr__close / tos_stdevall__tos_stdevall_u1__close
            - fn: "tos_stdevall"
              inputs: "close"
              grid:
                length: "expanding"
                stds: [1, 2, 3]
                ddof: 1

            # 7) vhf__vhf__close
            - fn: "vhf"
              inputs: "close"
              grid:
                length: 28
                drift: 1

            # 8) smi__smio__close
            - fn: "smi"
              inputs: "close"
              grid:
                fast: 5
                slow: 20
                signal: 5

            # 9) exhc__exhc_upa__close
            - fn: "exhc"
              inputs: "close"
              grid:
                length: 4
                cap: 13
                show_all: true

            # 10) squeeze__sqz_off__0
            - fn: "squeeze"
              inputs: ["high", "low", "close"]
              grid:
                bb_length: 20
                bb_std: 2.0
                kc_length: 20
                kc_scalar: 1.5
                mom_length: 12
                mom_smooth: 6
                mamode: "sma"

            # 11) eri__bearp__0
            - fn: "eri"
              inputs: ["high", "low", "close"]
              grid:
                length: 13
                mamode: "ema"

            # 12) rwi__rwil__0
            - fn: "rwi"
              inputs: ["high", "low", "close"]
              grid:
                length: 14
                mamode: "rma"
                drift: 1

            # 13) cfo__cfo__close
            - fn: "cfo"
              inputs: "close"
              grid:
                length: 9
                scalar: 100
                drift: 1

            # 14) kurtosis__kurt__close
            - fn: "kurtosis"
              inputs: "close"
              grid:
                length: 30

            # 15) skew__skew__close
            - fn: "skew"
              inputs: "close"
              grid:
                length: 30

            # 16) macd__macdh__12__26__9__close
            - fn: "macd"
              inputs: "close"
              grid:
                fast: 12
                slow: 26
                signal: 9

            # 17) stochrsi__stochrsik__close
            - fn: "stochrsi"
              inputs: "close"
              grid:
                length: 14
                rsi_length: 14
                k: 3
                d: 3
                mamode: "sma"

            # 18) bbands__bbl__40
            - fn: "bbands"
              inputs: "close"
              grid:
                length: 40
                std: 2.0
                mamode: "sma"

            # 19) pvr__pvr__0
            - fn: "pvr"
              inputs: ["close", "volume"]
              grid:
                drift: 1

            # 20) pvt__pvt__0
            - fn: "pvt"
              inputs: ["close", "volume"]
              grid:
                drift: 1

            # 21) efi__efi__0
            - fn: "efi"
              inputs: ["close", "volume"]
              grid:
                length: 13
                mamode: "ema"
                drift: 1

            # 22) decreasing__dec__close
            - fn: "decreasing"
              inputs: "close"
              grid:
                length: 1
                drift: 1
                strict: false

            # 23) mom__mom__close
            - fn: "mom"
              inputs: "close"
              grid:
                length: 10

            # 24) pgo__pgo__0
            - fn: "pgo"
              inputs: ["high", "low", "close"]
              grid:
                length: 14

            # 25) vortex__vtxm__0
            - fn: "vortex"
              inputs: ["high", "low", "close"]
              grid:
                length: 14
                drift: 1

            # 26) cti__cti__close
            - fn: "cti"
              inputs: "close"
              grid:
                length: 12

            # 27) reflex__reflex__close
            - fn: "reflex"
              inputs: "close"
              grid:
                length: 20
                smooth: 20
                alpha: 0.04

            # 28) tsv__tsvr__0
            - fn: "tsv"
              inputs: ["close", "volume"]
              grid:
                length: 18
                signal: 10
                mamode: "sma"

            # 29) amat__amate_lr__close
            - fn: "amat"
              inputs: "close"
              grid:
                fast: 8
                slow: 21
                lookback: 2
                mamode: "ema"
