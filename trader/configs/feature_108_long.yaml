features:
  plan:
    # === 時間週期：對應 DOW_SIN ===
    - name: TIME_CYC
      enabled: true
      kwargs:
        tz: "Asia/Taipei"
        daily: false          # 只要週期，不要日內
        weekly: true          # 會產生 DOW_SIN, DOW_COS

    # === FNG（sent_fng_diff1） ===
    # build_fng 會一次產出 sent_fng, sent_fng_diff1, sent_fng_z7d
    - name: FNG_IDX
      enabled: true
      kwargs: {}

    # === ATR / ATRP：ATR_14, ATRP_14, ATR_28, ATRP_28 ===
    - name: ATR
      enabled: true
      kwargs:
        length: 14
        pct: true    # 會有 ATR_14 與 ATRP_14

    - name: ATR
      enabled: true
      kwargs:
        length: 28
        pct: true    # 會有 ATR_28 與 ATRP_28

    # === RANGE：RANGE_16, RANGE_32 ===
    - name: RANGE
      enabled: true
      kwargs:
        window: 16
        pct: true    # → RANGE_16

    - name: RANGE
      enabled: true
      kwargs:
        window: 32
        pct: true    # → RANGE_32

    # === LOGRET：LOGRET_1, LOGRET_16 ===
    # 一次算出兩個 lag
    - name: LOGRET
      enabled: true
      kwargs:
        lags: [1, 16]
        pct: false   # log return，而不是 pct_change

    # === RSI：RSI_14, RSI_28 ===
    - name: RSI
      enabled: true
      kwargs:
        length: 14

    - name: RSI
      enabled: true
      kwargs:
        length: 28

    # === KDJ J 線：J_9_3（覆蓋你原本 J_9_3 / kdj__j__0 那兩個）===
    - name: KDJ
      enabled: true
      kwargs:
        k: 9
        d: 3
        smooth_k: 3   # 產生欄位 J_9_3

    # === AMAT 長期趨勢：AMATe_LR_8_21_2 / amat__amate_lr__close ===
    # 這裡直接用你在 IndicatorLibrary 定義的 AMATE_LR
    - name: AMATE_LR
      enabled: true
      kwargs:
        fast: 8
        slow: 21
        mamode: "ema"   # 若你的 AMATE_LR 是吃 int，可改回 2

    # === PVR（Price Volume Ratio / Rank）===
    # 這會產生一個 PVR 欄位：對應你原本的 PVR / pvr__pvr__0
    - name: PVR
      enabled: true
      kwargs: {}

    # === 價量混合：PXV_LR_VCHG ===
    # build_PXVOL 會產出：DIR_STRENGTH, PXV_LR_VCHG, DIRxVOL
    - name: PXVOL
      enabled: true
      kwargs: {}

    # === EWMRET：EWM_M_12, EWM_M_48, EWM_S_4, EWM_S_12, EWM_S_48 ===
    # 你的 build_EWMRET 會對每個 halflife 建立：
    #   EWM_M_{hl}, EWM_S_{hl}
    - name: EWMRET
      enabled: true
      kwargs:
        halflife: [4, 12, 48]

    # === ZS：ZS_[8, 32, 96] ===
    - name: ZS
      enabled: true
      kwargs:
        length: 8

    - name: ZS
      enabled: true
      kwargs:
        length: 32

    - name: ZS
      enabled: true
      kwargs:
        length: 96

    # === SLOPE：SLOPE_[4, 8, 16] ===
    - name: SLOPE
      enabled: true
      kwargs:
        length: 4

    - name: SLOPE
      enabled: true
      kwargs:
        length: 8

    - name: SLOPE
      enabled: true
      kwargs:
        length: 16

    # === 透過 VBT 跑 pandas_ta 指標 ===
    - VBT:
        enabled: true
        kwargs:
          lib: pandas_ta
          all: false
          items:
            # 1) er__er__close
            - fn: "er"
              inputs: "close"
              grid:
                length: 10
                drift: 1

            # 2) thermo__thermos__0
            - fn: "thermo"
              inputs: ["high", "low", "close"]
              grid:
                length: 20
                long: 2
                short: 0.5
                mamode: "ema"

            # 3) squeeze_pro__sqzpro_off__0 / squeeze_pro__sqzpro_on_narrow__0
            - fn: "squeeze_pro"
              inputs: ["high", "low", "close"]
              grid:
                bb_length: 20
                bb_std: 2.0
                kc_length: 20
                kc_scalar_wide: 2.0
                kc_scalar_normal: 1.5
                kc_scalar_narrow: 1.0
                mom_length: 12
                mom_smooth: 6
                mamode: "sma"

            # 4) macd__macdh__12__26__9__close
            - fn: "macd"
              inputs: "close"
              grid:
                fast: 12
                slow: 26
                signal: 9

            # 5) vhf__vhf__close
            - fn: "vhf"
              inputs: "close"
              grid:
                length: 28
                drift: 1
