timeframe: 15m
indicators:
- name: decay__ldecay__close
  formula: Linear decay of the close series using pandas_ta.decay(mode='linear') to
    keep recent moves weighted.
  parameters:
    length: 1
    mode: linear
  period: 1
- name: dpo__dpo__close
  formula: Detrended Price Oscillator = close - SMA(close, length=20) to remove the
    longer-term trend component.
  parameters:
    length: 20
    centered: true
  period: 20
- name: EWM_S_4
  formula: Rolling standard deviation of log returns with EWM halflife 4 (build_EWMRET,
    stat=std).
  parameters:
    halflife: 4
    stat: std
  period: 4
- name: DOW_COS
  formula: Cosine of the day-of-week angle sin(2π * dow / 7) from build_TIME_CYC (Asia/Taipei).
  parameters:
    tz: Asia/Taipei
    weekly: true
  period: 672
- name: EWM_S_12
  formula: EWM standard deviation of log returns with halflife 12 (build_EWMRET, stat=std).
  parameters:
    halflife: 12
    stat: std
  period: 12
- name: ATR_28
  formula: Average True Range over 28 bars using pandas_ta.atr and pct normalization
    enabled.
  parameters:
    length: 28
    pct: true
  period: 28
- name: stc__stcstoch__close
  formula: Schaff Trend Cycle stochastic component (STCstoch) computed with tc_length=10,
    fast=12, slow=26, factor=0.5.
  parameters:
    tc_length: 10
    fast: 12
    slow: 26
    factor: 0.5
  period: 10
- name: ATRP_28
  formula: Relative ATR = ATR_28 divided by abs(close) emitted alongside ATR when
    pct=True.
  parameters:
    length: 28
    pct: true
  period: 28
- name: ATRP_14
  formula: ATR_14 normalized by abs(close) (build_ATR with pct=True).
  parameters:
    length: 14
    pct: true
  period: 14
- name: ATR_14
  formula: Average True Range over 14 bars (pandas_ta.atr).
  parameters:
    length: 14
    pct: true
  period: 14
- name: stc__stc__close
  formula: Schaff Trend Cycle main line (STC) configured with tc_length=10, fast=12,
    slow=26, factor=0.5.
  parameters:
    tc_length: 10
    fast: 12
    slow: 26
    factor: 0.5
  period: 10
- name: supertrend__supertd__0
  formula: SuperTrend direction line built from ATR length 10 and multiplier 3 over
    the close series.
  parameters:
    length: 10
    multiplier: 3
  period: 10
- name: RANGE_32
  formula: Mean of (high - low)/abs(close) across a 32-bar rolling window (pct version).
  parameters:
    window: 32
    pct: true
  period: 32
- name: RANGE_16
  formula: Mean of (high - low)/abs(close) over 16 bars (build_RANGE).
  parameters:
    window: 16
    pct: true
  period: 16
- name: chandelier_exit__chdlrextd__0
  formula: Chandelier Exit direction indicator (1/-1) using high_length=22, low_length=22,
    atr_length=14, multiplier=2.0.
  parameters:
    high_length: 22
    low_length: 22
    atr_length: 14
    multiplier: 2.0
  period: 22
- name: increasing__inc__close
  formula: Binary flag (1/0) when close_t > close_{t-1} (pandas_ta.increasing length=1).
  parameters:
    length: 1
    strict: false
  period: 1
- name: STOCHd_32
  formula: Stochastic %D line using k=32, d=3, smooth_k=3 on the OHLC window (pandas_ta.stoch).
  parameters:
    k: 32
    d: 3
    smooth_k: 3
  period: 32
- name: EWM_S_48
  formula: Exponentially weighted std of log returns with halflife 48 (build_EWMRET
    stat=std).
  parameters:
    halflife: 48
    stat: std
  period: 48
- name: adx__dmp__0
  formula: Positive Directional Movement (DMP) from ADX length 14 (pandas_ta.adx).
  parameters:
    length: 14
  period: 14
- name: rwi__rwih__0
  formula: Random Walk Index high line (length=14, mamode='rma') measuring trend vs
    randomness.
  parameters:
    length: 14
    mamode: rma
    drift: 1
  period: 14
- name: fisher__fishert__0
  formula: Fisher Transform main line with length=9 and signal=1 on hl2(high, low)
    (pandas_ta.fisher).
  parameters:
    length: 9
    signal: 1
  period: 9
- name: STOCHk_32
  formula: Stochastic %K line with k=32, d=3, smooth_k=3 (pandas_ta.stoch).
  parameters:
    k: 32
    d: 3
    smooth_k: 3
  period: 32
- name: eri__bullp__0
  formula: Bull Power = high_t - EMA(close, length=13) capturing upward pressure (pandas_ta.eri).
  parameters:
    length: 13
  period: 13
- name: reflex__reflex__close
  formula: Reflex zero-lag cycle indicator (length=20, smooth=20, alpha=0.04) from
    pandas_ta.reflex.
  parameters:
    length: 20
    smooth: 20
    alpha: 0.04
  period: 20
- name: MOM_[4, 8, 16]
  formula: Momentum differences close_t - close_{t-L} for L in {4,8,16}.
  parameters:
    lengths:
    - 4
    - 8
    - 16
  period:
  - 4
  - 8
  - 16
- name: mom__mom__close
  formula: Simple momentum close_t - close_{t-10} (pandas_ta.mom default length 10).
  parameters:
    length: 10
  period: 10
- name: roc__roc__close
  formula: Rate of Change % = 100 * (close_t / close_{t-10} - 1) (pandas_ta.roc length=10).
  parameters:
    length: 10
    scalar: 100
  period: 10
- name: STOCHd_16
  formula: Stochastic %D line with k=16, d=3, smooth_k=3 (pandas_ta.stoch).
  parameters:
    k: 16
    d: 3
    smooth_k: 3
  period: 16
- name: kdj__d__0
  formula: KDJ %D line (3-period smoothing of %K) using length=9 and signal=3.
  parameters:
    length: 9
    signal: 3
  period: 9
- name: squeeze_pro__sqzpro_on_wide__0
  formula: Squeeze Pro ON (wide) flag when Bollinger Bands (20,2) sit outside the
    wide Keltner channel (scalar=2.0) with momo smoothing 12/6.
  parameters:
    bb_length: 20
    bb_std: 2.0
    kc_length: 20
    kc_scalar_wide: 2.0
    kc_scalar_normal: 1.5
    kc_scalar_narrow: 1.0
    mom_length: 12
    mom_smooth: 6
    mamode: sma
  period: 20
- name: sent_fng
  formula: Fear & Greed Index raw value merged into the 15m sheet (build_fng).
  parameters: {}
  period: 1
- name: kvo__kvo__0
  formula: Klinger Volume Oscillator using EMA fast=34 slow=55, signal=13 derived
    from signed volume and hlc3.
  parameters:
    fast: 34
    slow: 55
    signal: 13
    mamode: ema
  period: 55
- name: eom__eom__0
  formula: Ease of Movement averaged over 14 bars relating HLC and volume (pandas_ta.eom
    length=14).
  parameters:
    length: 14
  period: 14
- name: fisher__fisherts__0
  formula: Shifted Fisher signal line (pandas_ta.fisher length=9, signal=1) used for
    crossover cues.
  parameters:
    length: 9
    signal: 1
  period: 9
- name: squeeze__sqz__0
  formula: TTM Squeeze value (BB vs KC) with bb_length=20, kc_length=20, kc_scalar=1.5,
    smoothed momentum 12/6.
  parameters:
    bb_length: 20
    bb_std: 2.0
    kc_length: 20
    kc_scalar: 1.5
    mom_length: 12
    mom_smooth: 6
    mamode: sma
  period: 20
- name: squeeze_pro__sqzpro__0
  formula: Squeeze Pro oscillator line (scalar-based momentum) built with bb_length=20,
    kc_length=20, mom_length=12, mom_smooth=6.
  parameters:
    bb_length: 20
    bb_std: 2.0
    kc_length: 20
    kc_scalar_wide: 2.0
    kc_scalar_normal: 1.5
    kc_scalar_narrow: 1.0
    mom_length: 12
    mom_smooth: 6
    mamode: sma
  period: 20
- name: DPO_[8, 16]
  formula: Detrended Price Oscillator values for lengths 8 and 16 (close - SMA(close,
    L)).
  parameters:
    lengths:
    - 8
    - 16
    centered: true
  period:
  - 8
  - 16
- name: trendflex__trendflex__close
  formula: Trendflex cycle indicator (length=20, smooth=20, alpha=0.04) complementary
    to Reflex.
  parameters:
    length: 20
    smooth: 20
    alpha: 0.04
  period: 20
- name: MACD_4_12_6
  formula: MACD line using fast=4, slow=12 with a 6-bar signal EMA (pandas_ta.macd).
  parameters:
    fast: 4
    slow: 12
    signal: 6
  period: 12
- name: rsx__rsx__close
  formula: RSX (Juric Relative Strength Xtra) chain with length=14 smoothing the RSI.
  parameters:
    length: 14
  period: 14
- name: donchian__dcl__0
  formula: Donchian lower band (min low over 20 bars) as volatility filter.
  parameters:
    lower_length: 20
    upper_length: 20
  period: 20
- name: eri__bearp__0
  formula: Bear Power = low_t - EMA(close, length=13) highlighting downward pressure
    (pandas_ta.eri).
  parameters:
    length: 13
  period: 13
- name: ebsw__ebsw__close
  formula: Even Better Sinewave cycle indicator with length=40 and bars=10 (pandas_ta.ebsw).
  parameters:
    length: 40
    bars: 10
  period: 40
- name: macd__macdh__12__26__9__close
  formula: MACD histogram = MACD - EMA(MACD,9) with MACD taken from EMA(close,12)
    - EMA(close,26).
  parameters:
    fast: 12
    slow: 26
    signal: 9
  period: 26
- name: coppock__copc__close
  formula: Coppock Curve = WMA(ROC(fast=11)+ROC(slow=14), length=10) signals momentum
    turning points.
  parameters:
    length: 10
    fast: 11
    slow: 14
  period: 14
- name: kdj__k__0
  formula: KDJ %K line (fast stochastic) with length=9, signal=3.
  parameters:
    length: 9
    signal: 3
  period: 9
- name: sent_fng_z7d
  formula: 7-day z-score of the Fear & Greed Index (z7d column merged via build_fng).
  parameters:
    window: 7
  period: 7
- name: ao__ao__0
  formula: Awesome Oscillator = SMA(median price,5) - SMA(median price,34) per Bill
    Williams.
  parameters:
    fast: 5
    slow: 34
  period: 34
- name: bias__bias_sma__close
  formula: 'Bias relative to SMA(close,26): (close / SMA) - 1 measuring mean reversion.'
  parameters:
    length: 26
    mamode: sma
  period: 26
- name: tsv__tsv__0
  formula: Time Segmented Volume cumulative money flow sum with length=18 and signal
    SMA 10 (raw TSV value).
  parameters:
    length: 18
    signal: 10
    mamode: sma
  period: 18
- name: entropy__entp__close
  formula: Rolling entropy over 10 bars measuring unpredictability of the close (base
    2).
  parameters:
    length: 10
    base: 2
  period: 10
- name: smi__smi__close
  formula: SMI oscillator main line using fast=5, slow=20, signal=5 (pandas_ta.smi).
  parameters:
    fast: 5
    slow: 20
    signal: 5
  period: 20
- name: ppo__ppoh__close
  formula: PPO histogram = PPO - EMA(PPO,9) with PPO derived from EMA(close,12)-EMA(close,26).
  parameters:
    fast: 12
    slow: 26
    signal: 9
    scalar: 100
  period: 26
- name: smi__smis__close
  formula: SMI signal (EMA of the main SMI line) for fast=5, slow=20, signal=5.
  parameters:
    fast: 5
    slow: 20
    signal: 5
  period: 20
- name: kvo__kvos__0
  formula: KVO signal EMA with fast=34, slow=55, signal=13 (pandas_ta.kvo).
  parameters:
    fast: 34
    slow: 55
    signal: 13
    mamode: ema
  period: 55
- name: qqe__qqe_rsima__close
  formula: QQE smoothed RSI (length=14, smooth=5, factor=4.236) forming the core trend
    line.
  parameters:
    length: 14
    smooth: 5
    factor: 4.236
    mamode: ema
  period: 14
- name: inertia__inertia__0
  formula: Inertia indicator (length=20, rvi_length=14) smoothing the Relative Volatility
    Index via least squares regression.
  parameters:
    length: 20
    rvi_length: 14
    mamode: ema
  period: 20
- name: STOCHk_16
  formula: Stochastic %K with k=16, d=3, smooth_k=3 (pandas_ta.stoch).
  parameters:
    k: 16
    d: 3
    smooth_k: 3
  period: 16
- name: tsv__tsvs__0
  formula: TSV signal SMA (length=10) used as the normalization line for the TSV ratio.
  parameters:
    length: 18
    signal: 10
    mamode: sma
  period: 10
- name: hlc3__hlc3__0
  formula: HLC3 = (high + low + close) / 3 providing the tri-band midpoint passthrough.
  parameters: {}
  period: 1
